name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Stamp version (run number)
        run: |
          sed -i "s/versionCode = .*/versionCode = ${{ github.run_number }}/" app/build.gradle.kts
          sed -i "s/versionName = .*/versionName = \"1.1.${{ github.run_number }}\"/" app/build.gradle.kts
          grep -E "versionCode|versionName" app/build.gradle.kts

      # Optional stable signing: store your keystore (base64) + passwords as repo secrets.
      # Without them, the next step builds with Gradle's default debug key.
      - name: Restore keystore from secret (if provided)
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > app/telos.keystore
            echo "keystore restored from secret"
          else
            echo "no SIGNING_KEYSTORE_B64 → default debug-key signing"
          fi

      # Optional: set these repo secrets/variable to reproduce stable-key signing + your own
      # live-served UI. Without them, CI still builds a self-contained, debug-key-signed APK.
      - name: Build debug APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          TELOS_REMOTE_URL: ${{ vars.TELOS_REMOTE_URL }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeTerm-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
